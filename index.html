<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Arquivo Confidencial</title>


<style>

body {

    background: black;
    color: white;
    text-align: center;
    font-family: Arial, sans-serif;

}


h1 {

    margin-top: 80px;

}


input {

    padding: 12px;
    font-size: 18px;
    margin-top: 20px;

}


button {

    padding: 12px;
    font-size: 18px;
    cursor: pointer;
    margin-left: 10px;

}


#jumpscare {

    display: none;

    position: fixed;

    top: 0;
    left: 0;

    width: 100%;
    height: 100%;

    background: black;

    z-index: 10;

}


#jumpscare img {

    width: 100%;
    height: 100%;

    object-fit: cover;

}


#final {

    display: none;

    position: fixed;

    top: 0;
    left: 0;

    width: 100%;
    height: 100%;

}


#final img {

    width: 100%;
    height: 100%;

    object-fit: cover;

}


</style>


</head>



<body>


<h1>ARQUIVO CONFIDENCIAL</h1>


<p>Digite a senha para acessar o arquivo.</p>



<input type="password" id="senha" placeholder="Senha">



<button onclick="verificar()">

Entrar

</button>



<div id="jumpscare">

<img src="erro.jpg">

</div>



<div id="final">

<img src="Tipora.jpg">

</div>



<audio id="somSusto">

<source src="susto.mp3" type="audio/mpeg">

</audio>




<script>


function verificar(){


let senha = document.getElementById("senha").value;



if(senha.toLowerCase() == "ilha"){


document.getElementById("final").style.display = "block";


}


else{


document.getElementById("jumpscare").style.display = "block";


document.getElementById("somSusto").play();


}


}



</script>



</body>


</html>
